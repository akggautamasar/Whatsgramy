name: Build and verify Whatsgramy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whatsgramy-build
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run check && npm test
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle phone engine and pinned native runtime
        run: bash scripts/prepare-mobile.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify signature and packaging
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Whatsgramy-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  install:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Whatsgramy-preview-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install --no-streaming apk/app-debug.apk
            adb shell am start -W -n com.whatsgramy.app/.MainActivity
            adb forward tcp:18787 tcp:8787
            for attempt in $(seq 1 90); do curl -fsS http://127.0.0.1:18787/health && break || sleep 2; done
            curl --fail http://127.0.0.1:18787/health
            adb shell run-as com.whatsgramy.app cat files/engine/ready.json > runtime.json
            python3 -c 'import json; x=json.load(open("runtime.json")); assert x["sqlite"] and x["phoneOnly"] and x["node"].startswith("v24.")' 
            adb shell pidof com.whatsgramy.app
            adb exec-out screencap -p > whatsgramy-start.png
            adb logcat -d -b crash > crash.log
            test ! -s crash.log || ! grep -q 'FATAL EXCEPTION' crash.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Whatsgramy-install-check
          path: |
            whatsgramy-start.png
            crash.log
            runtime.json
  publish:
    needs: [backend, android, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Whatsgramy-preview-apk
          path: apk
      - name: Publish verified preview
        run: |
          set -euo pipefail
          mv apk/app-debug.apk Whatsgramy-0.3.0-preview.apk
          sha256sum Whatsgramy-0.3.0-preview.apk > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Whatsgramy phone-only engine preview.

          Links WhatsApp and Telegram directly inside the APK. No hosted backend is required.
          Open Settings, connect Telegram using your API ID/hash, then pair WhatsApp using Linked devices.
          Includes verified Telegram archives, automatic recovery indexes, upload history, file type controls, retention, manual local deletion and retrieval.
          Android background execution limits apply; use Start / resume when the engine is stopped.
          CI checks engine startup, actual Android SQLite support, API health and installation on an Android emulator. Live account pairing still needs validation with your accounts.
          Debug-signed preview; signing keys can differ between builds. Stable production signing is not configured.
          NOTES
          gh release create "preview-$GITHUB_RUN_NUMBER" Whatsgramy-0.3.0-preview.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Whatsgramy 0.3.0 preview (build $GITHUB_RUN_NUMBER)" --notes-file notes.md --prerelease
